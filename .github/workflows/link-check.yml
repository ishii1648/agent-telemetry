name: Link check

on:
  pull_request:
    paths:
      - "**.md"
      - "site/**"
      - ".github/workflows/link-check.yml"
      - ".lycheeignore"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "site/**"
  schedule:
    # 週次で外部リンクの rot を検知する（毎週月曜 09:00 JST = 00:00 UTC）
    - cron: "0 0 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Run lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          # Markdown 全般 + Hugo content をチェック対象にする
          # docs/archive/ は過去の意思決定記録（凍結）で削除済みファイルへの link 切れを許容する
          # --remap: 自リポジトリの tree/main・blob/main 絶対 URL を checkout 済みの
          #   local file に向け直す。同一 PR で新規追加したファイル/dir を main URL で
          #   参照しても merge 前に 404 にならず（forward reference の false positive 回避）、
          #   typo は local file 不在として引き続き検出される。\$1 は lychee の置換用 capture
          #   なので、entrypoint の `eval lychee ${ARGS}` で消費されないよう backslash で escape する。
          args: >-
            --no-progress
            --max-retries 2
            --cache
            --max-cache-age 1d
            --exclude-path .git
            --exclude-path site/public
            --exclude-path site/resources
            --exclude-path docs/archive
            --remap "https://github.com/ishii1648/agent-telemetry/(?:tree|blob)/main/(.*) file://${{ github.workspace }}/\$1"
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
