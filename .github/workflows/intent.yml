name: Intent

on:
  pull_request:

permissions:
  contents: read

jobs:
  # PR description must link a related issue (the why lives in issues/), or
  # explicitly declare N/A for issue-less chores. This replaces the old
  # affected_paths lint as the device that keeps the why discoverable.
  #
  # The regex accepts the issue path in any lifecycle location: open
  # (issues/NNNN-), closed (issues/closed/NNNN-), and pending
  # (issues/pending/NNNN-). A PR that resolves and `git mv`s an issue to
  # closed/ in the same change should be able to link the closed/ path.
  pr-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Require issue link or explicit N/A in PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eq 'issues/(closed/|pending/)?[0-9]{4}-|\(N/A'; then
            echo "OK: PR description references an issue or declares N/A."
          else
            echo "::error::PR description must link a related issue (issues/NNNN-<cat>-<slug>.md) or state '(N/A — chore)'." >&2
            exit 1
          fi

  # Regression guard for the grep-based intent-lookup script.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
      - name: Test intent-lookup
        run: make test-intent
