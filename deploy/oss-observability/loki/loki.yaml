# Grafana Loki — single binary 設定。ローカル検証用に filesystem storage +
# inmemory ring + 単一レプリカ + auth 無効で最小構成にする。
# native OTLP ingest (/otlp/v1/logs) を使うので structured metadata を許可する。
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  # "entry too far behind" は ingester の head chunk 受理窓 (max_chunk_age 由来、
  # 既定 2h) で決まる。agent-telemetry の初回 flush は数週間ぶんの過去イベントを
  # 一括投入するため、検証用に窓を広げて過去ログも head chunk に追記できるようにする。
  max_chunk_age: 2160h # 90 日

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # native OTLP は log attribute を structured metadata に載せるため必須。
  allow_structured_metadata: true
  volume_enabled: true
  # agent-telemetry のイベントは過去セッションの occurred_at を timestamp に持つ。
  # Loki の既定 (reject_old_samples: 1 週間) だと初回 flush で過去ログが弾かれ
  # "entry too far behind" で部分却下されるため、検証用に受理窓を大きく取る。
  reject_old_samples: false
  # 未来方向のずれ (clock skew / バッチ遅延) も検証用に許容する。
  creation_grace_period: 24h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
