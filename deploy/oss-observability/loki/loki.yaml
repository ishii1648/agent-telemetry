# Grafana Loki — single binary 設定。ローカル検証用に filesystem storage +
# inmemory ring + 単一レプリカ + auth 無効で最小構成にする。
# native OTLP ingest (/otlp/v1/logs) を使うので structured metadata を許可する。
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # native OTLP は log attribute を structured metadata に載せるため必須。
  allow_structured_metadata: true
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
