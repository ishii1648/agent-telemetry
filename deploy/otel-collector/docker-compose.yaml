# Local OTel Collector for the agent-telemetry collector recipe.
#
#   DD_API_KEY=... DD_SITE=datadoghq.com DEPLOY_ENV=dev docker compose up
#
# Then point a client export target at http://localhost:4318 (see README.md).
# The config (collector-config.yaml) reshapes attributes and exports to Datadog;
# uncomment its otlphttp/secondary exporter to also fan out to a second backend
# or the agent-telemetry-server (SQLite/Grafana path).
services:
  otel-collector:
    # 再現性のため版を pin する (:latest だと検証時と運用時で OTTL の挙動が動く)。
    # collector-config.yaml の OTTL は context-prefixed 記法 (log.attributes[...])
    # を使うので contrib v0.153.0 で valid (警告ゼロ)。版を上げる際は
    # `validate --config` で警告が出ないことを確認すること。
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otelcol/collector-config.yaml:ro
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
    ports:
      - "4318:4318" # OTLP/HTTP (clients flush here)
